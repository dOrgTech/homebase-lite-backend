[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "."
  environment = { NODE_VERSION = "22" }

[functions]
  node_bundler = "zisi"
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5000
  framework = "#custom"

